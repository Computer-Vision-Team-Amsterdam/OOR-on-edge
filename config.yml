customer: "THOR"
aml_model_name: OOR-model  # We're not currently pulling the model from AML so this is purely administrative
aml_model_version: 2  # We're not currently pulling the model from AML so this is purely administrative

azure_iot:
  hostname: "{HOSTNAME_IOT}"
  device_id: "Luna"  # Corresponds to the folder in the landingzone where data will be uploaded
  shared_access_key: "{SHARED_ACCESS_KEY_IOT}"

data_delivery_pipeline:
  sleep_time: 60  # Time (seconds) to wait before checking for new data

detection_pipeline:
  input_path: "/input"  # Path in docker, not on device (see docker-compose.yml)
  input_path_on_host: "/home/jetson/velotech-data"  # Path on host so we can strip it from full paths in metadata
  metadata_rel_path: "json_tasks"  # Folder in input where JSON metadata files are stored
  quarantine_rel_path: "json_tasks/quarantine"  # Folder in input where failed JSON metadata files are stored
  detections_output_path: "/detections"  # Path in docker, not on device (see docker-compose.yml)
  inference_params:  # YOLO inference parameters
    img_size: 1280
    conf: 0.3
    save_img_flag: False
    save_txt_flag: False
    save_conf_flag: False
  model_name: "yolov8m_1280_v2.2_curious_hill_12.engine"  # Change .pt to .engine to export to TensorRT
  pretrained_model_path: "/model_artifacts"  # Path in docker, not on device (see docker-compose.yml)
  target_classes: [2, 3, 4]  # These will be detected
  sensitive_classes: [0, 1]  # These will be blurred
  output_image_size: [1280, 720]  # `null` means keep original size
  target_classes_conf: 0.7  # `null` means conf is taken from inference_params
  sensitive_classes_conf: null  # `null` means conf is taken from inference_params
  draw_bounding_boxes: False  # Whether to draw bounding boxes around detected target class objects
  blur_mode: "box"  # Whether to use GaussianBlur ("gaussian") or a gray box ("box"). Box is less computationally expensive.
  skip_invalid_gps: True  # Whether or not to skip invalid GPS values (i.e. lat/lon = 0)
  acceptable_gps_delay: 5  # Acceptable delay in seconds between image recording and GPS signal, or inf to allow any delay
  speedometer_ema_factor: 10  # Exponential Moving Average factor for speedometer
  min_speed: 0.25  # Minimum driving speed in m/s, recordings below this speed will be skipped
  move_detection_timeout: 5.0  # Detector timeout in seconds after last detected move
  move_detection_min_dist: 2.0  # Distance to last location (in m) after which device is assumed to be moving
  max_aggregated_metadata_length: 120  # Save and reset when aggregated metadata reaches this length 
  sleep_time: 60  # Time (seconds) to wait before checking for new data
  training_mode: False  # Set to True to keep a backup of all input data
  training_mode_destination_path: "/training_mode"  # Path in docker where backup will be stored
  save_blurred_labels: False  # If True, annotations of blurred objects will be saved in training_mode_destination_path

model_conversion_pipeline:
  overwrite_if_exists: False  # Whether to recompile the model even if a compiled version already exists

logging:
  loglevel_own: DEBUG  # override loglevel for packages defined in `own_packages`
  own_packages: ["__main__", "oor_on_edge", "detection_pipeline", "data_delivery_pipeline", "model_conversion_pipeline", "performance_monitoring"]
  basic_config:
    # log config as arguments to `logging.basicConfig`
    level: WARNING
    format: "%(asctime)s|||%(levelname)-8s|%(name)s|%(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  ai_instrumentation_key: "{AI_INSTRUMENTATION_KEY}"
  luna_logs_dir: "/cvt_logs"
  sleep_time: 60
